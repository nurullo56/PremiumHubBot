version: '3.8'

services:
  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: premiumhub_bot
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ../database:/app/database
      - ../backups:/app/backups
      - ../logs:/app/logs
    networks:
      - bot_network
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  bot_network:
    driver: bridge
